services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-db-pilot:latest}
    container_name: db-pilot
    restart: unless-stopped
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:${APP_PORT:-3000}:3000"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_API_BASE_URL=${DEEPSEEK_API_BASE_URL:-}
      - BAILIAN_API_KEY=${BAILIAN_API_KEY}
      - BAILIAN_API_BASE_URL=${BAILIAN_API_BASE_URL:-}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL:-}
      - LANGFUSE_CAPTURE_CONTENT=${LANGFUSE_CAPTURE_CONTENT:-false}
      - SQL_WRITE_ENABLED=${SQL_WRITE_ENABLED:-false}
      - SQL_WRITE_ALLOWLIST=${SQL_WRITE_ALLOWLIST:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - DEMO_DB_ENABLED=${DEMO_DB_ENABLED:-false}
      - DEMO_DB_NAME=${DEMO_DB_NAME:-电商演示库}
      - DEMO_DB_HOST=${DEMO_DB_HOST:-}
      - DEMO_DB_PORT=${DEMO_DB_PORT:-3306}
      - DEMO_DB_USER=${DEMO_DB_USER:-}
      - DEMO_DB_PASSWORD=${DEMO_DB_PASSWORD:-}
      - DEMO_DB_DATABASE=${DEMO_DB_DATABASE:-}
      - DB_SSL_CA_HOST=${DB_SSL_CA_HOST:-}
      - DB_SSL_CA=${DB_SSL_CA:-}
      - MEMO_CHAT_API_BASE=${MEMO_CHAT_API_BASE:-http://127.0.0.1:7860}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/workbench/dbpilot"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
